<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7f1">
<title>Audra's Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fbf7f1; --ink:#3b2f2a; --muted:#8c7e74; --line:#eee5da; --card:#fffdf9;
  --period:#f2a6ad; --fertile:#9fd3a8; --sel:#3b2f2a;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:17px;line-height:1.5;
  max-width:480px;margin:0 auto;padding:0 20px calc(110px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 0 6px}
.brand{font-family:'Fredoka',sans-serif;font-weight:500;font-size:22px;letter-spacing:.01em}
.brand span{color:#e58a96}
.today-btn{font-family:'Fredoka',sans-serif;font-weight:500;font-size:15px;padding:8px 16px;border-radius:999px;background:var(--ink);color:#fff;min-height:40px}
.today-btn[hidden]{display:none}

/* week nav */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.weeknav .range{font-family:'Fredoka',sans-serif;font-weight:500;font-size:17px;color:var(--muted)}
.arrow{width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1;color:var(--ink);background:var(--card);border:1.5px solid var(--line)}
.arrow:disabled{opacity:.3;cursor:default}

/* day strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:18px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:18px;min-height:68px}
.dbtn .wd{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.dbtn .num{font-family:'Fredoka',sans-serif;font-weight:500;font-size:20px;line-height:1.2;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.dbtn .dots{height:8px;display:flex;gap:3px}
.dbtn .dot{width:6px;height:6px;border-radius:50%}
.dot.p{background:var(--period)} .dot.f{background:var(--fertile)}
.dbtn.sel .num{background:var(--sel);color:#fff}
.dbtn.istoday:not(.sel) .num{box-shadow:inset 0 0 0 2px var(--sel)}
.dbtn:disabled{opacity:.28;cursor:default}

/* hero */
.hero{border-radius:32px;overflow:hidden;background:var(--hero,#fde0e0)}
.hero img{display:block;width:100%;aspect-ratio:520/440;object-fit:cover;object-position:center 30%}
.titlerow{margin:18px 2px 2px}
.phase{font-family:'Fredoka',sans-serif;font-weight:600;font-size:30px;line-height:1.15}
.sub{color:var(--muted);font-weight:600;font-size:16px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 2px 0}
.chip{font-weight:700;font-size:14px;padding:5px 12px;border-radius:999px;background:#f3ece3}
.chip.p{background:#fbdfe2;color:#a4434f}
.chip.f{background:#dcf0df;color:#3d7a4a}
.chip.t{background:var(--ink);color:#fff}

/* 3 blocks */
.block{margin-top:22px;padding-top:18px;border-top:1.5px solid var(--line)}
.block h3{font-family:'Fredoka',sans-serif;font-weight:500;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.block p{font-size:18px;line-height:1.5}
.foot{margin:28px 2px 0;color:var(--muted);font-size:14px;line-height:1.45}

/* week view */
.summary{background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:18px 20px;margin-bottom:14px}
.summary .head{font-family:'Fredoka',sans-serif;font-weight:600;font-size:23px;line-height:1.2}
.summary .line{margin-top:8px;font-size:17px}
.summary .line b{font-weight:700}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px;border-radius:24px;margin-bottom:6px;background:transparent}
.row.sel{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.row:disabled{opacity:.28;cursor:default}
.thumb{width:68px;height:60px;border-radius:18px;overflow:hidden;flex-shrink:0;background:var(--hero,#eee)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.rtxt{flex:1;min-width:0}
.rtxt .d{font-family:'Fredoka',sans-serif;font-weight:500;font-size:18px;line-height:1.2}
.rtxt .s{color:var(--muted);font-size:15px;font-weight:600}
.tone{font-weight:700;font-size:14px;padding:5px 12px;border-radius:999px;background:#f3ece3;white-space:nowrap}
.tone.up{background:#dcf0df;color:#3d7a4a}
.tone.dn{background:#fde4d0;color:#a85a1f}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(251,247,241,0))}
.seg{display:flex;background:#f1e9de;border-radius:999px;padding:5px;width:100%;max-width:340px}
.seg button{flex:1;font-family:'Fredoka',sans-serif;font-weight:500;font-size:18px;padding:12px 0;border-radius:999px;color:var(--muted);min-height:48px}
.seg button.on{background:var(--ink);color:#fff}
.view[hidden]{display:none}
</style>
</head>
<body>

<div class="top">
  <div class="brand">audra's <span>forecast</span></div>
  <button class="today-btn" id="todayBtn" hidden>Today</button>
</div>

<div class="weeknav">
  <button class="arrow" id="prevW" aria-label="Previous week">&#8249;</button>
  <div class="range" id="range"></div>
  <button class="arrow" id="nextW" aria-label="Next week">&#8250;</button>
</div>

<div class="view" id="vDay">
  <div class="strip" id="strip"></div>
  <div id="dayBody"></div>
</div>

<div class="view" id="vWeek" hidden>
  <div id="weekBody"></div>
</div>

<div class="nav">
  <div class="seg">
    <button id="tDay" class="on">Day</button>
    <button id="tWeek">Week</button>
  </div>
</div>

<script>
/* ---------- cycle data (Garmin) ---------- */
const dn = (y,m,d) => Date.UTC(y,m,d)/864e5;               // timezone/DST-safe day number
const dt = n => new Date(n*864e5);
const WD  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// period starts: Aug 27, Sep 25, Oct 25 = logged. Nov 22 onward = Garmin forecast (28-day cycles)
const STARTS = [[2026,7,27],[2026,8,25],[2026,9,25],[2026,10,22],[2026,11,20],[2027,0,17],[2027,1,14],[2027,2,14],[2027,3,11]].map(a=>dn(...a));
const RANGE_START = STARTS[0];
const RANGE_END   = dn(2027,2,31);
const PERIOD_LEN  = 8;

function info(n){
  if(n<RANGE_START||n>RANGE_END) return null;
  for(let i=0;i<STARTS.length-1;i++){
    if(n>=STARTS[i]&&n<STARTS[i+1]){
      const len=STARTS[i+1]-STARTS[i], day=n-STARTS[i]+1;
      return {day,len,period:day<=PERIOD_LEN,fertile:day>=len-17&&day<=len-11};
    }
  }
  return null;
}

/* ---------- phases + drawings ---------- */
const PHASES = [
  {to:2,  key:'menstruation',    name:'Menstruation',    days:'Days 1-2',   bg:'#fde0e0'},
  {to:6,  key:'early-menstrual', name:'Early menstrual', days:'Days 3-6',   bg:'#fddde3'},
  {to:12, key:'follicular',      name:'Follicular',      days:'Days 7-12',  bg:'#dde8fb'},
  {to:15, key:'ovulation',       name:'Ovulation',       days:'Days 13-15', bg:'#d6ecd6'},
  {to:20, key:'early-luteal',    name:'Early luteal',    days:'Days 16-20', bg:'#fdf0bf'},
  {to:26, key:'late-luteal',     name:'Late luteal',     days:'Days 21-26', bg:'#fbd9b3'},
  {to:99, key:'premenstrual',    name:'Premenstrual',    days:'Day 27+',    bg:'#fbdbe4'},
];
const phaseOf = day => PHASES.find(p=>day<=p.to);

/* ---------- per-day content ----------
   d = already documented (your own reports)   b = biology   k = keep in mind
   t = tone word   l = level (1 brighter, 0 neutral, -1 rougher)                */
const DAYS = {
 1:{t:'crampy',l:-1,
  d:"Heavy flow, pain and lower energy. You feel emotional relief once bleeding starts, even when the cramps are bad.",
  b:"Estrogen and progesterone hit their lowest. Prostaglandins make the uterus contract, which is what causes cramps. Flow usually builds through the day.",
  k:"Ibuprofen blocks prostaglandins, so it works best taken early rather than once the pain peaks. Heat helps too."},
 2:{t:'crampy',l:-1,
  d:"Heavy flow and pain that disturbed your sleep. Once you chose finishing your website over a group run.",
  b:"Flow is often heaviest on days 1-3 and prostaglandins stay high, so cramps and lower-back pain can peak. Blood loss slowly lowers iron.",
  k:"Iron-rich food (red meat, lentils) with vitamin C helps replace losses. Heat and an anti-inflammatory before bed can stop pain waking you."},
 3:{t:'bloated',l:-1,
  d:"One of your most bloated days (3-4). Sadness or a depressive dip has been reported here, though not every cycle.",
  b:"Fluid shifts and slower, irregular gut movement from prostaglandins commonly cause bloating while hormones sit low. FSH is rising and recruiting follicles.",
  k:"Less salt and alcohol help with water retention. Water and potassium-rich food (banana, potato) help counter it."},
 4:{t:'bloated',l:-1,
  d:"Still one of your most bloated days. You called it 'absolutely horrible' once, and felt affectionate and romantic on days 4-5 in another cycle.",
  b:"Flow is usually easing and prostaglandins are falling. Estrogen starts a slow climb, but mood doesn't always follow hormones on schedule.",
  k:"Bloating can linger a day or two after flow eases. Magnesium-rich food (nuts, dark chocolate) may help with cramps and bloat."},
 5:{t:'tender',l:-1,
  d:"Very emotional, with depressive feelings reported. You haven't found this day consistently good.",
  b:"Estrogen is rising as follicles grow and the uterine lining starts rebuilding. Pain usually fades, but mood can lag behind the physical recovery.",
  k:"Protein, iron and sleep are the cheap levers for a low day like this."},
 6:{t:'unpredictable',l:0,
  d:"Inconsistent: a sudden big improvement in one cycle, feeling horrible and extra sensitive in another.",
  b:"A dominant follicle is usually selected around now and estrogen climbs steadily, supporting serotonin and dopamine. The lift is real but not always smooth.",
  k:"Both a high and a low are on record here, so keep plans flexible instead of banking on either."},
 7:{t:'unsettled',l:0,
  d:"One report of a sudden depressive dip, the day after a much better day 6. A single observation, not a pattern.",
  b:"Estrogen keeps rising and the lining thickens. Insulin sensitivity is generally better in the follicular phase, so energy from food tends to be steadier.",
  k:"If a dip hits, check sleep and food first. Otherwise use the steadier energy for work that needs focus."},
 8:{t:'lifting',l:1,
  d:"Nothing documented yet.",
  b:"Estrogen keeps rising and cervical mucus is still scant or sticky. High estrogen supports muscle repair, so strength work often feels good this week.",
  k:"Good window to start demanding projects and heavy lifting while energy is climbing."},
 9:{t:'bright',l:1,
  d:"One emotional dip reported after feeling better earlier. A single observation.",
  b:"Estrogen is high and accelerating and cervical mucus turns creamy. Verbal fluency and social drive often rise toward ovulation.",
  k:"A dip here doesn't mean the upswing is over. Hormones are still climbing. Check sleep and caffeine first."},
 10:{t:'jittery',l:0,
  d:"You said 'I feel extremely anxious' on this day, and noted fertile-type cervical mucus around now.",
  b:"Mucus turns wetter and clearer as estrogen climbs, and testosterone nudges up too, so libido often rises. LH starts to climb.",
  k:"If you feel wired, caffeine amplifies it. Cutting it after noon is the quickest lever."},
 11:{t:'glowing',l:1,
  d:"Nothing day-specific documented. Vulnerability and high libido are reported around ovulation overall.",
  b:"Estrogen nears its peak and mucus turns slippery and stretchy (egg-white), the most sperm-friendly type. Fertility is climbing.",
  k:"Fertility is rising. If you're avoiding pregnancy, this is when contraception matters most."},
 12:{t:'self-critical',l:0,
  d:"You said 'I feel fat and ugly' on this day (Oct 6). One report, not a pattern.",
  b:"Estrogen is at or near its peak and the LH surge is close, which triggers ovulation roughly 24-36 hours later.",
  k:"Skip scale checks and progress comparisons today. Water shifts and mood both skew how your body reads."},
 13:{t:'magnetic',l:1,
  d:"Libido, vulnerability and relationship sensitivity are reported around ovulation, but nothing is confirmed for this exact day.",
  b:"Estrogen peaks and the LH surge begins. Libido is typically near its highest and many people feel more energetic and social.",
  k:"Good day for anything that needs confidence or connection. Protect your sleep, it is often lighter around ovulation."},
 14:{t:'high',l:1,
  d:"You said you felt horrible about your body on this day. One report.",
  b:"Around the LH surge the egg is released within about a day. Some people feel a one-sided pelvic twinge (mittelschmerz).",
  k:"Two body-image dips are on record near ovulation (days 12 and 14). Give yourself a buffer before judging anything."},
 15:{t:'drop risk',l:-1,
  d:"End of ovulation: a sudden low and loss of confidence, in your words. Day 15 once brought extreme sensitivity and trouble working.",
  b:"Estrogen falls sharply after its peak just as progesterone starts rising. That swing can trigger a mood dip in people who are sensitive to it.",
  k:"Confidence drops can arrive suddenly here. Hold off on big self-judgments for a day. It tends to return a little in the luteal phase."},
 16:{t:'recovering',l:0,
  d:"Your confidence tends to come back a little in the luteal phase. Nothing else documented for this day.",
  b:"The corpus luteum forms and starts making progesterone. Body temperature rises about 0.3-0.5 C and stays up until your period.",
  k:"Ease back in. Protein, daylight and sleep help the recovery from the post-ovulation drop."},
 17:{t:'hungry',l:0,
  d:"Nothing documented yet.",
  b:"Progesterone climbs. It slows digestion and raises appetite and sleepiness. Metabolic rate rises a little, roughly 100-300 kcal per day.",
  k:"A bigger appetite is normal physiology. Meet it with protein and fibre rather than fighting it."},
 18:{t:'steady',l:0,
  d:"A post-ovulation low is mentioned in general, but there is no day-specific report.",
  b:"Progesterone is rising toward its peak. Water retention, breast tenderness and a shorter fuse can start to appear.",
  k:"A good stretch to front-load deadlines before the late-luteal days."},
 19:{t:'steady',l:0,
  d:"Acute back pain after training was reported once in this part of your cycle.",
  b:"Progesterone is climbing toward its peak, usually about a week after ovulation. Sleep can get lighter, partly because body temperature runs higher.",
  k:"Hip and lumbar mobility work before heavy hinging is cheap insurance if your back flares."},
 20:{t:'steady',l:0,
  d:"No pattern documented for this day.",
  b:"Progesterone is near its peak. Its metabolite allopregnanolone acts on GABA receptors: calming for some people, jittery or anxious for others.",
  k:"Start protecting sleep now. It's the best-documented thing that breaks down in the next few days."},
 21:{t:'sleepless',l:-1,
  d:"Insomnia and emotional difficulty are mentioned around here. Sleep trouble is better documented than any specific mood.",
  b:"Progesterone peaks around now. If there's no pregnancy, the corpus luteum starts to break down. Hunger and cravings are common.",
  k:"Cool room, no caffeine after noon, screens down earlier. Sleep is the lever with the best evidence for you."},
 22:{t:'anxious',l:-1,
  d:"Your strongest anxiety record: 'I feel extremely anxious today' (Apr 29). You have also called this phase 'absolutely horrible'.",
  b:"Estrogen and progesterone both begin to fall. That withdrawal drives PMS symptoms in people who are sensitive to hormonal swings.",
  k:"On anxious days, walking or lifting and less caffeine tend to take the edge off. Reduce the number of open decisions."},
 23:{t:'hungry',l:0,
  d:"You were very hungry on day 23 (Oct 17). Appetite is documented here, mood isn't.",
  b:"Hormones keep falling and serotonin activity tends to dip, which can raise anxiety, irritability and appetite.",
  k:"Regular meals with protein help. Skipped meals tend to amplify luteal irritability and cravings."},
 24:{t:'wired',l:0,
  d:"On Oct 18 you were hyperactive, restless and full of work ideas, yet physically exhausted.",
  b:"Falling progesterone lowers calming GABA tone while stress systems stay reactive, so many people feel wired, restless or sleep poorly.",
  k:"Capture the ideas, but protect sleep. Tonight's rest matters more than a third work session."},
 25:{t:'tender',l:0,
  d:"Nothing documented yet.",
  b:"Water retention and breast tenderness commonly peak, skin can break out, and sleep is often lighter.",
  k:"Lower salt, more water and looser clothes help with the bloat while it lasts."},
 26:{t:'driven',l:0,
  d:"Much higher sexual desire before your period, sometimes without wanting romantic closeness. Exact onset isn't confirmed.",
  b:"Prostaglandins start building in the lining. Libido often rises before the period as progesterone falls.",
  k:"Desire and wanting closeness can come apart before your period. It helps to name which one you mean."},
 27:{t:'driven',l:0,
  d:"Energetic, accelerated and decisive even on little sleep, with high libido. Sometimes fine, but stress can tip it into restless and anxious.",
  b:"Both hormones are near their lowest. Bloating, cramps and mood swings are classic late-luteal signs.",
  k:"Use the drive on concrete tasks. Avoid stacking extra stressors on top, since that's what tips it into anxiety."},
 28:{t:'bloated',l:-1,
  d:"Bloating, cramps and worry about body changes close to your period. No consistent mood pattern.",
  b:"Progesterone is at its floor and the lining is about to shed. Prostaglandins rise, so mild cramps can start before the flow.",
  k:"Keep ibuprofen and a heat pack within reach. Starting early works better."},
 29:{t:'crampy',l:-1,
  d:"Your periods often begin around here. Premenstrual intensity and libido are reported, not specifically for this day.",
  b:"Body temperature typically drops just before bleeding starts. Progesterone is at baseline, so the lining sheds.",
  k:"Have supplies ready and take ibuprofen at the first cramp rather than waiting."},
 30:{t:'waiting',l:0,
  d:"Nothing day-specific documented for day 30.",
  b:"Your cycles have run 26-31 days. A later period usually means ovulation came later, and stress can shift timing too.",
  k:"Garmin adjusts the forecast once you log the period. Keep supplies on hand."}
};
const dayData = day => DAYS[Math.min(day,30)];

/* ---------- state ---------- */
const now = new Date();
const TODAY = dn(now.getFullYear(), now.getMonth(), now.getDate());
const clamp = n => Math.max(RANGE_START, Math.min(RANGE_END, n));
const state = {sel: clamp(TODAY), tab:'day'};
const weekStart = n => n - ((dt(n).getUTCDay()+6)%7);        // Monday

const $ = id => document.getElementById(id);
const fmtLong  = n => `${WD[dt(n).getUTCDay()]} ${dt(n).getUTCDate()} ${MO[dt(n).getUTCMonth()]}`;
const fmtShort = n => `${MO[dt(n).getUTCMonth()]} ${dt(n).getUTCDate()}`;

/* ---------- render ---------- */
function renderNav(){
  const ws = weekStart(state.sel);
  $('range').textContent = `${fmtShort(ws)} - ${fmtShort(ws+6)}`;
  $('prevW').disabled = ws <= weekStart(RANGE_START);
  $('nextW').disabled = ws+7 > RANGE_END;
  $('todayBtn').hidden = (state.sel === clamp(TODAY));
}

function dotsHTML(i){
  if(!i) return '';
  return (i.period?'<span class="dot p"></span>':'') + (i.fertile?'<span class="dot f"></span>':'');
}

function renderStrip(){
  const ws = weekStart(state.sel);
  let h='';
  for(let k=0;k<7;k++){
    const n=ws+k, i=info(n);
    h+=`<button class="dbtn${n===state.sel?' sel':''}${n===TODAY?' istoday':''}" data-n="${n}" ${i?'':'disabled'}>
      <span class="wd">${WD[dt(n).getUTCDay()].slice(0,2)}</span>
      <span class="num">${dt(n).getUTCDate()}</span>
      <span class="dots">${dotsHTML(i)}</span></button>`;
  }
  $('strip').innerHTML=h;
}

function renderDay(){
  renderStrip();
  const i=info(state.sel);
  if(!i){ $('dayBody').innerHTML='<p class="foot">No forecast for this date.</p>'; return; }
  const p=phaseOf(i.day), c=dayData(i.day);
  let chips='';
  if(state.sel===TODAY) chips+='<span class="chip t">Today</span>';
  if(i.period) chips+='<span class="chip p">Period</span>';
  if(i.fertile) chips+='<span class="chip f">Fertile window</span>';
  $('dayBody').innerHTML=`
    <div class="hero" style="--hero:${p.bg}"><img src="img/${p.key}.webp" alt="" width="520" height="440"></div>
    <div class="titlerow">
      <div class="phase">${p.name}</div>
      <div class="sub">Day ${i.day} &middot; ${fmtLong(state.sel)}</div>
    </div>
    ${chips?`<div class="chips">${chips}</div>`:''}
    <div class="block"><h3>Already documented</h3><p>${c.d}</p></div>
    <div class="block"><h3>What's happening</h3><p>${c.b}</p></div>
    <div class="block"><h3>Keep in mind</h3><p>${c.k}</p></div>
    <p class="foot">Based on your Garmin cycle data and the patterns you've reported. Dates after Oct 25 are forecasts.</p>`;
}

function renderWeek(){
  const ws=weekStart(state.sel);
  const days=[]; for(let k=0;k<7;k++){ const n=ws+k, i=info(n); if(i) days.push({n,i,p:phaseOf(i.day),c:dayData(i.day)}); }
  // summary
  const phases=[]; days.forEach(x=>{ if(!phases.includes(x.p.name)) phases.push(x.p.name); });
  const names = arr => arr.map(x=>WD[dt(x.n).getUTCDay()]).join(', ');
  const rough=days.filter(x=>x.c.l<0), bright=days.filter(x=>x.c.l>0);
  const first=days[0], last=days[days.length-1];
  let sum=`<div class="head">${phases.join(' &rarr; ')}</div>`;
  sum+=`<div class="line">Starts <b>${first.c.t}</b>, ends <b>${last.c.t}</b>.</div>`;
  sum+=`<div class="line">Rougher: <b>${rough.length?names(rough):'nothing flagged'}</b></div>`;
  sum+=`<div class="line">Brighter: <b>${bright.length?names(bright):'nothing flagged'}</b></div>`;
  let rows='';
  for(let k=0;k<7;k++){
    const n=ws+k, i=info(n);
    if(!i){ rows+=`<button class="row" disabled><div class="rtxt"><div class="d">${fmtLong(n)}</div><div class="s">outside forecast</div></div></button>`; continue; }
    const p=phaseOf(i.day), c=dayData(i.day);
    rows+=`<button class="row${n===state.sel?' sel':''}" data-n="${n}">
      <div class="thumb" style="--hero:${p.bg}"><img src="img/${p.key}.webp" alt="" loading="lazy"></div>
      <div class="rtxt"><div class="d">${fmtLong(n)}</div><div class="s">Day ${i.day} &middot; ${p.name}</div></div>
      <span class="tone${c.l>0?' up':c.l<0?' dn':''}">${c.t}</span></button>`;
  }
  $('weekBody').innerHTML=`<div class="summary">${sum}</div>${rows}`;
}

function render(){
  renderNav();
  $('vDay').hidden = state.tab!=='day';
  $('vWeek').hidden = state.tab!=='week';
  $('tDay').classList.toggle('on',state.tab==='day');
  $('tWeek').classList.toggle('on',state.tab==='week');
  if(state.tab==='day') renderDay(); else renderWeek();
}

/* ---------- events ---------- */
$('strip').addEventListener('click',e=>{ const b=e.target.closest('.dbtn'); if(b&&!b.disabled){ state.sel=+b.dataset.n; render(); }});
$('weekBody').addEventListener('click',e=>{ const b=e.target.closest('.row'); if(b&&!b.disabled){ state.sel=+b.dataset.n; state.tab='day'; render(); window.scrollTo(0,0); }});
$('prevW').addEventListener('click',()=>{ state.sel=clamp(state.sel-7); render(); });
$('nextW').addEventListener('click',()=>{ state.sel=clamp(state.sel+7); render(); });
$('todayBtn').addEventListener('click',()=>{ state.sel=clamp(TODAY); render(); });
$('tDay').addEventListener('click',()=>{ state.tab='day'; render(); window.scrollTo(0,0); });
$('tWeek').addEventListener('click',()=>{ state.tab='week'; render(); window.scrollTo(0,0); });

render();
</script>
</body>
</html>
