<html lang="fr">

<title>Audra Forecast</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --white:#ffffff; --off:#f7f5f2; --ink:#1a1a1a; --mid:#777; --light:#e5e2de;
  --period:#e74c3c; --follicular:#2ecc71; --ovulation:#9b59b6;
  --luteal-e:#e67e22; --luteal-m:#5dade2; --luteal-l:#2980b9;
  --fertility-none:#ccc; --fertility-low:#a8d5b5; --fertility-high:#e8a030; --fertility-peak:#d63b2f;
}
body { background:var(--white); color:var(--ink); font-family:'DM Sans',sans-serif; min-height:100vh; padding-bottom:60px; }

header { background:var(--ink); padding:20px 20px 16px; position:fixed; top:0; left:0; right:0; z-index:200; }
.header-eye { font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:#666; margin-bottom:4px; }
.header-title { font-family:'Bebas Neue',sans-serif; font-size:38px; letter-spacing:0.04em; line-height:1; color:#fff; }
.header-title span { color:#f59e0b; }
.tabs { display:flex; border-bottom:2px solid var(--ink); position:fixed; top:0; left:0; right:0; background:var(--white); z-index:199; }
.tab { flex:1; padding:15px 0; text-align:center; font-size:12px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--mid); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; transition:all 0.2s; }
.tab.active { color:var(--ink); border-bottom-color:var(--ink); }

.date-scroll { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.date-scroll::-webkit-scrollbar { display:none; }
.month-group { flex-shrink:0; }
.month-name { font-size:10px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--mid); margin-bottom:6px; padding-left:2px; }
.month-days { display:flex; gap:6px; }

.day-btn { width:44px; height:56px; border-radius:6px; border:1.5px solid var(--light); background:var(--white); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; flex-shrink:0; transition:all 0.15s; }
.day-btn:active { transform:scale(0.95); }
.day-btn.phase-period     { border-color:var(--period); }
.day-btn.phase-follicular { border-color:var(--follicular); }
.day-btn.phase-ovulation  { border-color:var(--ovulation); }
.day-btn.phase-luteal-e   { border-color:var(--luteal-e); }
.day-btn.phase-luteal-m   { border-color:var(--luteal-m); }
.day-btn.phase-luteal-l   { border-color:var(--luteal-l); }
.day-btn.selected.phase-period     { background:var(--period);    border-color:var(--period); }
.day-btn.selected.phase-follicular { background:var(--follicular); border-color:var(--follicular); }
.day-btn.selected.phase-ovulation  { background:var(--ovulation);  border-color:var(--ovulation); }
.day-btn.selected.phase-luteal-e   { background:var(--luteal-e);   border-color:var(--luteal-e); }
.day-btn.selected.phase-luteal-m   { background:var(--luteal-m);   border-color:var(--luteal-m); }
.day-btn.selected.phase-luteal-l   { background:var(--luteal-l);   border-color:var(--luteal-l); }
.day-btn.selected .dnum  { color:#fff; }
.day-btn.selected .dname { color:rgba(255,255,255,0.6); }
.day-btn.selected .dpip  { background:rgba(255,255,255,0.5) !important; }
.dnum  { font-family:'Bebas Neue',sans-serif; font-size:20px; line-height:1; color:var(--ink); }
.dname { font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--mid); }
.dpip  { width:5px; height:5px; border-radius:50%; }
.day-btn.phase-period     .dpip { background:var(--period); }
.day-btn.phase-follicular .dpip { background:var(--follicular); }
.day-btn.phase-ovulation  .dpip { background:var(--ovulation); }
.day-btn.phase-luteal-e   .dpip { background:var(--luteal-e); }
.day-btn.phase-luteal-m   .dpip { background:var(--luteal-m); }
.day-btn.phase-luteal-l   .dpip { background:var(--luteal-l); }

.detail-section { padding:0 20px; }

.day-hero { padding:22px 0 16px; border-bottom:1.5px solid var(--light); }
.day-hero-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
.day-hero-date { font-family:'Bebas Neue',sans-serif; font-size:34px; line-height:1; letter-spacing:0.03em; }
.phase-badge { display:inline-flex; align-items:center; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#fff; flex-shrink:0; margin-top:4px; }
.day-num-label { font-size:13px; color:var(--mid); margin-top:2px; }

.fertility-bar { display:flex; align-items:center; gap:10px; margin-top:12px; }
.fertility-label { font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--mid); white-space:nowrap; }
.fertility-pill { padding:5px 14px; border-radius:20px; font-size:12px; font-weight:600; color:#fff; }
.fertility-none  { background:#999; }
.fertility-low   { background:#2ecc71; }
.fertility-medium{ background:#e67e22; }
.fertility-high  { background:#e8a030; }
.fertility-peak  { background:#e74c3c; }

.info-card { margin-top:16px; border:1.5px solid var(--light); border-radius:6px; overflow:hidden; }
.card-header { padding:12px 16px; border-bottom:1.5px solid var(--light); background:var(--off); }
.card-label { font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; }
.card-label.bio     { color:var(--mid); }
.card-label.who     { color:var(--ovulation); }
.card-label.avoid   { color:var(--period); }
.card-label.green   { color:var(--follicular); }

.info-row { display:flex; gap:12px; padding:13px 16px; border-bottom:1px solid var(--light); align-items:flex-start; font-size:15px; line-height:1.5; }
.info-row:last-child { border-bottom:none; }
.row-icon { font-size:13px; flex-shrink:0; margin-top:3px; }

.pull-quote { margin-top:16px; padding:16px 18px; background:var(--off); border-left:4px solid var(--ink); }
.pull-quote p { font-family:'Fraunces',serif; font-style:italic; font-size:16px; line-height:1.55; color:var(--ink); }

.picker-section { padding:20px 20px 16px; border-bottom:2px solid var(--ink); background:var(--off); }
.picker-label { font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--mid); margin-bottom:12px; }


.month-title { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:0.05em; color:var(--ink); padding:20px 0 4px; border-top:2px solid var(--ink); }
.month-title:first-child { border-top:none; padding-top:16px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:8px; }
.cal-day-label { text-align:center; font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--mid); padding:6px 0 8px; }
.cal-cell { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:4px; font-size:13px; font-weight:500; position:relative; background:var(--off); color:var(--ink); }
.cal-cell.empty { background:transparent; }
.cal-cell.is-today { background:var(--ink) !important; color:#fff !important; font-weight:700; }
.cal-cell .cpip { position:absolute; bottom:4px; width:5px; height:5px; border-radius:50%; }
.cal-cell.period-day     { background:rgba(231,76,60,0.15); } .cal-cell.period-day .cpip     { background:#e74c3c; }
.cal-cell.follicular-day { background:rgba(46,204,113,0.15);  } .cal-cell.follicular-day .cpip { background:#2ecc71; }
.cal-cell.ovulation-day  { background:rgba(155,89,182,0.15); } .cal-cell.ovulation-day .cpip  { background:#9b59b6; }
.cal-cell.luteal-e-day   { background:rgba(230,126,34,0.15);   } .cal-cell.luteal-e-day .cpip   { background:#e67e22; }
.cal-cell.luteal-m-day   { background:rgba(93,173,226,0.2); } .cal-cell.luteal-m-day .cpip   { background:#5dade2; }
.cal-cell.luteal-l-day   { background:rgba(41,128,185,0.15);  } .cal-cell.luteal-l-day .cpip   { background:#2980b9; }

.cal-legend { display:flex; flex-wrap:wrap; gap:8px 14px; padding:16px 0 4px; }
.cal-legend-item { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--mid); font-weight:500; }
.cal-legend-dot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }
</style>
</head>

  28:{
    bio:[
      "Toutes les hormones à leur minimum.",
      "Contractions utérines légères souvent présentes avant même le flux.",
    ],
    mood:"Bout du cycle. Peut ressentir une forme d'épuisement ou au contraire une impatience que les règles arrivent et que le reset commence.",
    avoid:[],
    prioritize:[],
  },
  29:{
    bio:[
      "Fin du cycle — règles imminentes ou déjà là.",
      "La chute finale de progestérone déclenche la desquamation de l'endomètre.",
    ],
    mood:"Reset imminent. L'inconfort pré-règles est à son pic mais le soulagement arrive avec le flux.",
    avoid:[],
    prioritize:[],
  },
};

const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const START = new Date(2026,6,31);
const END   = new Date(2027,0,14);
const DN_SHORT = ['Di','Lu','Ma','Me','Je','Ve','Sa'];
const MN_SHORT = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const MN_LONG  = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DN_LONG  = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];

function getCycleDay(date) {
  for (let i=0;i<CYCLES.length;i++) {
    const d = Math.floor((date-CYCLES[i])/86400000)+1;
    const next = CYCLES[i+1]||new Date(2027,0,23);
    const len = Math.floor((next-CYCLES[i])/86400000);
    if (d>=1&&d<=len) return {day:d,cycleLen:len};
  }
  return null;
}
function getPhase(d) {
  if (d<=8)  return 'period';
  if (d<=10) return 'follicular';
  if (d<=14) return 'ovulation';
  if (d<=20) return 'luteal-e';
  if (d<=23) return 'luteal-m';
  return 'luteal-l';
}

function buildScroll() {
  const scroll = document.getElementById('dateScroll');
  let currentMonth=-1, daysDiv=null;
  const d = new Date(START);
  while (d<=END) {
    const cyc = getCycleDay(d);
    if (!cyc){d.setDate(d.getDate()+1);continue;}
    const month = d.getMonth();
    if (month!==currentMonth) {
      const mg=document.createElement('div');mg.className='month-group';
      const mn=document.createElement('div');mn.className='month-name';
      mn.textContent=MN_SHORT[month];mg.appendChild(mn);
      daysDiv=document.createElement('div');daysDiv.className='month-days';
      mg.appendChild(daysDiv);scroll.appendChild(mg);
      currentMonth=month;
    }
    const phase=getPhase(cyc.day);
    const btn=document.createElement('div');
    btn.className=`day-btn ${PHASE_META[phase].cls}`;
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    btn.dataset.date=`${yyyy}-${mm}-${dd}`;
    btn.dataset.cycleDay=cyc.day;
    btn.dataset.phase=phase;
    btn.innerHTML=`<div class="dnum">${d.getDate()}</div><div class="dname">${DN_SHORT[d.getDay()]}</div><div class="dpip"></div>`;
    btn.addEventListener('click',()=>selectDate(btn));
    daysDiv.appendChild(btn);
    if (d.getTime()===TODAY.getTime()) {
      setTimeout(()=>{selectDate(btn);btn.scrollIntoView({inline:'center',behavior:'smooth'});},100);
    }
    d.setDate(d.getDate()+1);
  }
}

function selectDate(btn) {
  document.querySelectorAll('.day-btn.selected').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  const date=new Date(btn.dataset.date+'T00:00:00');
  renderDetail(date,parseInt(btn.dataset.cycleDay),btn.dataset.phase);
}

const PHASE_AVOID = {
  period:     [],
  follicular: [],
  ovulation:  ["L'intensité émotionnelle est haute dans les deux sens — les hauts sont vrais, les bas aussi."],
  'luteal-e': ["Surinvestir sur des projets ou décisions lancés dans l'élan ovulatoire — l'énergie baisse progressivement."],
  'luteal-m': ["Sérotonine et GABA en baisse — les stimuli émotionnels et physiques sont perçus plus intensément que la réalité ne le justifie."],
  'luteal-l': ["Décisions majeures dans un état d'agitation hormonale — la noradrénaline crée un sentiment d'urgence qui n'est pas toujours fondé."],
};
const PHASE_PRIORITIZE = {
  period:     ["Fer et protéines — la reconstruction de l'endomètre et la production de globules rouges sont actives tout au long de la phase."],
  follicular: ["Fenêtre optimale pour la prise de décision, les projets qui demandent de l'élan et la performance physique."],
  ovulation:  ["Libido et connexion au maximum. Fenêtre de fertilité courte — 12 à 24h après l'ovulation, l'ovocyte n'est plus viable."],
  'luteal-e': ["Besoins caloriques légèrement plus élevés — le métabolisme est plus actif en phase lutéale."],
  'luteal-m': ["Sommeil et récupération — la dette de sommeil se cumule vite quand la progestérone perturbe le sommeil profond."],
  'luteal-l': ["L'énergie noradrénergique de cette phase est réelle — bon moment pour les tâches qui demandent de la décision rapide, du tri, du nettoyage mental. Physiquement le corps gère bien l'effort mais la récupération est plus lente — privilégier la force sur l'endurance."],
};

function renderDetail(date,cycleDay,phase) {
  const meta=PHASE_META[phase];
  const data=DAY_DATA[Math.min(cycleDay,28)]||DAY_DATA[28];
  const fertility=FERTILITY[Math.min(cycleDay,28)]||'none';
  const dateLabel=`${DN_LONG[date.getDay()]} ${date.getDate()} ${MN_LONG[date.getMonth()]}`;
  const avoidList = data.avoid?.length ? data.avoid : PHASE_AVOID[phase]||[];
  const prioritizeList = data.prioritize?.length ? data.prioritize : PHASE_PRIORITIZE[phase]||[];

  let html=`<div class="day-hero">
    <div class="day-hero-top">
      <div>
        <div class="day-hero-date">${dateLabel}</div>
        <div class="day-num-label">Jour ${cycleDay} du cycle</div>
      </div>
      <div class="phase-badge" style="background:${meta.color}">${meta.label}</div>
    </div>
    <div class="fertility-bar">
      <div class="fertility-label">Fertilité</div>
      <div class="fertility-pill fertility-${fertility}">${FERTILITY_LABEL[fertility]}</div>
    </div>
  </div>`;

  // BIO
  if (data.bio?.length) {
    html+=`<div class="info-card"><div class="card-header"><div class="card-label bio">Ce qui se passe</div></div><div class="card-body">`;
    data.bio.forEach(b=>{html+=`<div class="info-row"><span class="row-icon">◆</span><span>${b}</span></div>`;});
    html+=`</div></div>`;
  }

  // MOOD
  if (data.mood) {
    html+=`<div class="info-card"><div class="card-header"><div class="card-label who">État émotionnel</div></div><div class="card-body"><div class="info-row"><span class="row-icon" style="color:var(--ovulation)">◈</span><span>${data.mood}</span></div></div></div>`;
  }

  // AVOID
  if (avoidList.length) {
    html+=`<div class="info-card"><div class="card-header"><div class="card-label avoid">À éviter</div></div><div class="card-body">`;
    avoidList.forEach(a=>{html+=`<div class="info-row"><span class="row-icon" style="color:var(--period)">✗</span><span>${a}</span></div>`;});
    html+=`</div></div>`;
  }

  // PRIORITIZE
  if (prioritizeList.length) {
    html+=`<div class="info-card"><div class="card-header"><div class="card-label green">À privilégier</div></div><div class="card-body">`;
    prioritizeList.forEach(p=>{html+=`<div class="info-row"><span class="row-icon" style="color:var(--follicular)">✓</span><span>${p}</span></div>`;});
    html+=`</div></div>`;
  }

  // NOTE
  if (data.note) {
    html+=`<div class="pull-quote"><p>${data.note}</p></div>`;
  }

  document.getElementById('detailSection').innerHTML=html;
}

let calBuilt = false;
function switchTab(tab) {
  document.getElementById('view-day').style.display = tab==='day' ? 'block' : 'none';
  document.getElementById('view-cal').style.display = tab==='cal' ? 'block' : 'none';
  document.getElementById('tab-day').classList.toggle('active', tab==='day');
  document.getElementById('tab-cal').classList.toggle('active', tab==='cal');
  if (tab==='cal' && !calBuilt) { buildCalendar(); calBuilt=true; }
}

function buildCalendar() {
  const container = document.getElementById('view-cal');
  const phaseClass = { period:'period-day', follicular:'follicular-day', ovulation:'ovulation-day', 'luteal-e':'luteal-e-day', 'luteal-m':'luteal-m-day', 'luteal-l':'luteal-l-day' };

  let html = `<div class="cal-legend">
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--period)"></div>Règles</div>
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--follicular)"></div>Folliculaire</div>
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--ovulation)"></div>Ovulation</div>
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--luteal-e)"></div>Post-ovul.</div>
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--luteal-m)"></div>Lutéale</div>
    <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--luteal-l)"></div>Pré-règles</div>
  </div>`;

  for (let i = 0; i < 6; i++) {
    const month = (7 + i) % 12;
    const year = (7 + i) < 12 ? 2026 : 2027;
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    html += `<div class="month-title">${MN_SHORT[month]} ${year}</div><div class="cal-grid">`;
    ['Di','Lu','Ma','Me','Je','Ve','Sa'].forEach(d => { html += `<div class="cal-day-label">${d}</div>`; });
    for (let i=0; i<firstDay; i++) html += `<div class="cal-cell empty"></div>`;
    for (let day=1; day<=daysInMonth; day++) {
      const date = new Date(year, month, day);
      const cyc = getCycleDay(date);
      const phase = cyc ? getPhase(cyc.day) : null;
      const pclass = phase ? phaseClass[phase] : '';
      const isToday = date.getTime() === TODAY.getTime();
      html += `<div class="cal-cell ${pclass} ${isToday?'is-today':''}">${day}${phase?'<div class="cpip"></div>':''}</div>`;
    }
    html += `</div>`;
  }
  container.innerHTML = html;
}

function fixLayout() {
  const header = document.querySelector('header');
  const tabs = document.querySelector('.tabs');
  const hh = header.offsetHeight;
  const th = tabs.offsetHeight;
  tabs.style.top = hh + 'px';
  document.body.style.paddingTop = (hh + th) + 'px';
}
window.addEventListener('load', fixLayout);
window.addEventListener('resize', fixLayout);

buildScroll();
</script>
